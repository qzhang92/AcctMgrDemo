<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A connected, fictional account-management demo with 20 static pages.">
  <meta name="color-scheme" content="light">
  <title>Contoso Account Services</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232d6457'/%3E%3Cpath d='M28 13a11 11 0 1 0 0 14' fill='none' stroke='white' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="pages.css">
  <script src="app.js" defer></script>
</head>
<body class="demo-app">
  <a class="skip-link" href="#main">Skip to page content</a>
  <aside class="sidebar" aria-label="Workspace">
    <a class="brand" href="#/Pages/01" aria-label="Contoso Account Services home">
      <span class="brand-mark">c<span></span></span>
      <span>contoso<span class="brand-caption">ACCOUNT SERVICES</span></span>
    </a>
    <button class="button nav-toggle" type="button" aria-expanded="false" aria-controls="workspace-nav" hidden>Browse 20 pages</button>
    <nav id="workspace-nav" class="workspace-nav" aria-label="Demo pages"></nav>
    <div class="workspace-footer"><span class="demo-dot"></span> FICTIONAL DEMO<span>20 pages. One connected workspace.</span></div>
  </aside>
  <div class="page">
    <header class="topbar">
      <div class="breadcrumbs"><a href="#/Pages/01">Workspace</a><span class="breadcrumb-divider">/</span><span id="breadcrumb-title">Account Services</span></div>
      <div class="topbar-meta"><span class="snapshot-dot"></span>Snapshot: 20 Oct 2026<span class="demo-badge">Fictional demo</span></div>
    </header>
    <main id="main" tabindex="-1" aria-busy="true">
      <div class="card loading-state" role="status">Loading your workspace...</div>
      <noscript><p>This demo uses JavaScript for navigation. Enable JavaScript, or browse the static HTML content in the Pages directory.</p></noscript>
    </main>
    <nav class="page-pager" aria-label="Previous and next demo page" hidden></nav>
    <footer class="app-footer"><span>contoso / Account Services</span><span>Fictional demonstration data &middot; Snapshot: 20 October 2026 &middot; USD, excluding tax</span></footer>
    <div id="route-status" class="sr-only" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
